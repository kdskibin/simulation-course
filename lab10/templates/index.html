<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СМО</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { padding: 20px; background-color: #f4f6f9; }
        .chart-container { position: relative; height: 350px; width: 100%; margin-bottom: 20px; }
        #log { height: 300px; overflow-y: scroll; background: #212529; color: #f8f9fa; padding: 15px; font-family: monospace; font-size: 0.85rem; border-radius: 5px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1 class="mb-4 text-primary">Моделирование СМО M/M/n/*</h1>
        
        <div class="row mb-4">
            <div class="col-lg-8">
                <div class="card mb-4">
                    <div class="card-header bg-white fw-bold">Параметры системы</div>
                    <div class="card-body">
                        <form id="simForm" class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">λ (Поступление заявок)</label>
                                <input type="number" step="0.1" class="form-control" id="lambda" value="5.0" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">μ (Обработка заявок)</label>
                                <input type="number" step="0.1" class="form-control" id="mu" value="2.0" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">n (Количество обработчиков)</label>
                                <input type="number" step="1" class="form-control" id="n" value="3" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Макс. размер очереди</label>
                                <input type="number" step="1" class="form-control" id="queue_size" value="15" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Макс. терпение (время)</label>
                                <input type="number" step="0.1" class="form-control" id="patience" value="5.0" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Длительность T</label>
                                <input type="number" step="1" class="form-control" id="t" value="100" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Вероятность VIP</label>
                                <input type="number" step="0.05" min="0" max="1" class="form-control" id="vip_prob" value="0" required>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary" id="btnRun">Запустить симуляцию</button>
                                <button type="button" class="btn btn-success" id="btnExport" disabled>Экспорт отчета (.txt)</button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header bg-white fw-bold">Динамика системы</div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="chartQueue"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-4">
                <div class="card mb-4">
                    <div class="card-header bg-white fw-bold">Итоговые доли заявок</div>
                    <div class="card-body">
                        <div style="height: 250px;">
                            <canvas id="chartResults"></canvas>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header bg-white fw-bold">Лог событий</div>
                    <div class="card-body p-0">
                        <div id="log"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chartQueue = null;
        let chartResults = null;
        let lastResults = null;
        let lastParams = null;

        document.getElementById('simForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btnRun = document.getElementById('btnRun');
            btnRun.disabled = true;
            btnRun.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Выполняется...';

            const params = {
                lambda: parseFloat(document.getElementById('lambda').value),
                mu: parseFloat(document.getElementById('mu').value),
                n: parseInt(document.getElementById('n').value),
                queue_size: parseInt(document.getElementById('queue_size').value),
                patience: parseFloat(document.getElementById('patience').value),
                t: parseFloat(document.getElementById('t').value),
                vip_prob: parseFloat(document.getElementById('vip_prob').value)
            };
            lastParams = params;

            try {
                const response = await fetch('/simulate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(params)
                });
                const data = await response.json();
                if (data.status === 'ok') {
                    lastResults = data.results;
                    updateCharts(data.results);
                    updateLog(data.results.log);
                    document.getElementById('btnExport').disabled = false;
                } else {
                    alert('Ошибка: ' + data.error);
                }
            } catch (err) {
                alert('Ошибка сети: ' + err);
            } finally {
                btnRun.disabled = false;
                btnRun.innerHTML = 'Запустить симуляцию';
            }
        });

        document.getElementById('btnExport').addEventListener('click', async function() {
            if (!lastResults || !lastParams) return;
            const payload = { ...lastParams, stats: lastResults.stats, log: lastResults.log };
            
            try {
                const response = await fetch('/export', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `lab10_report_n${lastParams.n}_T${lastParams.t}.txt`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (err) {
                alert('Ошибка экспорта: ' + err);
            }
        });

        function updateCharts(results) {
            const ctxRes = document.getElementById('chartResults').getContext('2d');
            if (chartResults) chartResults.destroy();
            chartResults = new Chart(ctxRes, {
                type: 'bar',
                data: {
                    labels: ['Обслужено', 'Отказы', 'Нетерпеливые'],
                    datasets: [{
                        label: 'Доля',
                        data: [results.stats.prop_served, results.stats.prop_refused, results.stats.prop_impatient],
                        backgroundColor: ['rgba(70, 130, 180, 0.8)', 'rgba(200, 70, 70, 0.8)', 'rgba(200, 160, 50, 0.8)']
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, max: 1, ticks: { callback: (v) => (v*100).toFixed(0) + '%' } } },
                    plugins: { legend: { display: false } }
                }
            });

            const ctxQ = document.getElementById('chartQueue').getContext('2d');
            if (chartQueue) chartQueue.destroy();
            
            chartQueue = new Chart(ctxQ, {
                type: 'line',
                data: {
                    labels: results.time_points.map(t => t.toFixed(1)),
                    datasets: [
                        {
                            label: 'Занятые серверы', data: results.busy_servers,
                            borderColor: 'rgb(70, 130, 180)', backgroundColor: 'rgba(70, 130, 180, 0.1)', tension: 0, pointRadius: 0, borderWidth: 2
                        },
                        {
                            label: 'Длина очереди', data: results.queue_length,
                            borderColor: 'rgb(200, 70, 70)', backgroundColor: 'rgba(200, 70, 70, 0.1)', tension: 0, pointRadius: 0, borderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { title: { display: true, text: 'Модельное время' }, ticks: { maxTicksLimit: 15 } },
                        y: { title: { display: true, text: 'Количество' }, beginAtZero: true }
                    }
                }
            });
        }

        function updateLog(logEntries) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML = logEntries.join('<br>');
            logDiv.scrollTop = logDiv.scrollHeight;
        }
    </script>
</body>
</html>
